# Apuração do 2º turno — Eleições 2026 (25/10/2026)
# Roda a cada 2 min SOMENTE no dia 25/10 (o script tem trava de data) + botão manual.
name: apuracao-2t

on:
  schedule:
    - cron: '*/2 * 25 10 *'   # a cada 2 min, dia 25 de outubro (UTC)
  workflow_dispatch: {}        # botão "Run workflow" p/ teste

permissions:
  contents: write

jobs:
  apurar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Atualizar dados do 2º turno
        run: python3 robo-2t/atualizar_2t.py --out dados-2t --municipios robo-2t/municipios
        env:
          REPO_SLUG: ${{ github.repository }}   # p/ purge do jsDelivr (opcional, falha silenciosa)
      - name: Publicar (só se mudou algo)
        run: |
          git config user.name "robo-2t"
          git config user.email "robo-2t@users.noreply.github.com"
          git add dados-2t/br.json dados-2t/uf/*.json
          git diff --cached --quiet || git commit -m "2T $(date -u '+%H:%M') UTC" && git push || true
